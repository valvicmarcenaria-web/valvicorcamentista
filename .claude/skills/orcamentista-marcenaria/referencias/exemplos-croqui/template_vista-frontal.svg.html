<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{ size:235mm 156mm; margin:0; }
*{margin:0;padding:0;box-sizing:border-box;}
body{ background:#FBF5E6; }
svg{ width:235mm; height:156mm; display:block; }
.t{ font-family:"Courier New",monospace; }
</style></head><body>
<svg viewBox="0 0 900 598" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="900" height="598" fill="#FBF5E6"/>
  <!-- TITULO -->
  <text x="40" y="46" class="t" font-size="20" font-weight="bold" fill="#1c2b34" letter-spacing="2">VISTA FRONTAL · ARMÁRIO BASE 2 PORTAS</text>
  <text x="41" y="66" class="t" font-size="11" fill="#6b7a80" letter-spacing="1">Elevação · geração de croqui · cotas em cm · escala ilustrativa</text>
  <line x1="40" y1="78" x2="430" y2="78" stroke="#C8902A" stroke-width="2"/>

  <!-- ===== DESENHO: elevação ===== -->
  <!-- corpo / tampo -->
  <g fill="none" stroke="#1c2b34">
    <!-- tampo (linha superior, leve sobre-largura) -->
    <line x1="232" y1="150" x2="552" y2="150" stroke-width="2.4"/>
    <!-- caixa -->
    <rect x="240" y="150" width="304" height="300" stroke-width="2.4"/>
    <!-- divisão das 2 portas -->
    <line x1="392" y1="166" x2="392" y2="404" stroke-width="1.5"/>
    <!-- linha que separa portas / base recuada -->
    <line x1="240" y1="404" x2="544" y2="404" stroke-width="1.5"/>
    <!-- portas (folga aparente) -->
    <rect x="250" y="166" width="134" height="238" stroke-width="1.5"/>
    <rect x="400" y="166" width="134" height="238" stroke-width="1.5"/>
    <!-- puxador cava (aresta interna das portas) -->
    <line x1="378" y1="250" x2="378" y2="320" stroke-width="3"/>
    <line x1="406" y1="250" x2="406" y2="320" stroke-width="3"/>
    <!-- prateleira interna OCULTA (tracejado) -->
    <line x1="252" y1="290" x2="532" y2="290" stroke-width="1" stroke-dasharray="6 5" opacity=".75"/>
    <!-- base recuada (rodapé) -->
    <line x1="262" y1="404" x2="262" y2="446" stroke-width="1.5"/>
    <line x1="522" y1="404" x2="522" y2="446" stroke-width="1.5"/>
    <line x1="262" y1="446" x2="522" y2="446" stroke-width="2.4"/>
  </g>
  <!-- label oculta -->

  <!-- ===== COTAS (ferrugem) ===== -->
  <g stroke="#9c3b2a" stroke-width="1" fill="#9c3b2a" font-family="Courier New,monospace">
    <!-- largura total 80 (abaixo) -->
    <line x1="240" y1="478" x2="544" y2="478"/>
    <path d="M240 473 L240 483 M544 473 L544 483"/>
    <rect x="372" y="470" width="40" height="16" fill="#FBF5E6" stroke="none"/>
    <text x="392" y="483" font-size="13" text-anchor="middle" stroke="none">80</text>
    <!-- segmentos das portas 39 / 39 -->
    <line x1="240" y1="462" x2="392" y2="462"/>
    <path d="M240 458 L240 466 M392 458 L392 466"/>
    <text x="316" y="467" font-size="11" text-anchor="middle" stroke="none">39</text>
    <line x1="392" y1="462" x2="544" y2="462"/>
    <path d="M392 458 L392 466 M544 458 L544 466"/>
    <text x="468" y="467" font-size="11" text-anchor="middle" stroke="none">39</text>
    <!-- altura total 72 (esquerda) -->
    <line x1="206" y1="150" x2="206" y2="446"/>
    <path d="M201 150 L211 150 M201 446 L211 446"/>
    <text x="196" y="302" font-size="13" text-anchor="middle" stroke="none" transform="rotate(-90 196 302)">ALT. 72</text>
    <!-- recuo da base 4 -->
    <line x1="240" y1="430" x2="262" y2="430"/>
    <text x="232" y="426" font-size="10" text-anchor="end" stroke="none">4</text>
  </g>

  <!-- ===== LEITURA TÉCNICA ===== -->
  <text x="600" y="116" class="t" font-size="15" font-weight="bold" fill="#1c2b34" letter-spacing="1">LEITURA TÉCNICA</text>
  <line x1="600" y1="126" x2="868" y2="126" stroke="#C8902A" stroke-width="1.4"/>
  <g class="t" font-size="11" fill="#1c2b34">
    <text x="600" y="150">• Corpo em 15mm; fundo 6mm encaixado.</text>
    <text x="600" y="172">• 2 portas de giro sobrepostas, com folga;</text>
    <text x="614" y="186">dobradiça de caneco (2 un. por porta).</text>
    <text x="600" y="208">• Puxador tipo cava na aresta interna</text>
    <text x="614" y="222">das portas (sem ferragem aparente).</text>
    <text x="600" y="244">• 1 prateleira interna regulável (oculta,</text>
    <text x="614" y="258">tracejado) sobre suportes.</text>
    <text x="600" y="280">• Base recuada (rodapé) de 4 cm.</text>
    <text x="600" y="302">• Elevação NÃO leva hachura (sem corte);</text>
    <text x="614" y="316">hachura só em corte/seção.</text>
  </g>

  <!-- ===== QUANTITATIVO DERIVADO ===== -->
  <rect x="596" y="338" width="276" height="74" fill="none" stroke="#9c3b2a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="610" y="360" class="t" font-size="12" font-weight="bold" fill="#9c3b2a">QUANTITATIVO DERIVADO →</text>
  <g class="t" font-size="10.5" fill="#1c2b34">
    <text x="610" y="380">2 laterais · 1 base · 1 tampo · 1 fundo (6mm)</text>
    <text x="610" y="396">2 portas · 1 prateleira · 4 dobradiças caneco</text>
    <text x="610" y="404"> </text>
  </g>

  <!-- RODAPE -->
  <line x1="40" y1="560" x2="868" y2="560" stroke="#C8902A" stroke-width="1"/>
  <text x="40" y="578" class="t" font-size="10" fill="#6b7a80">Lavínia · Geração de Croqui · Valvic Marcenaria</text>
  <text x="868" y="578" class="t" font-size="10" fill="#6b7a80" text-anchor="end">Vista frontal · NTS</text>
</svg>
</body></html>
