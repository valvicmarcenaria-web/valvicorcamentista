A" text-anchor="end" font-weight="400" letter-spacing="0">porta B — plano dianteiro</text><rect x="1173.6" y="300.0" width="106.8" height="54.0" fill="#C8901E" fill-opacity="0.16" stroke="#9C6B12" stroke-width="1.1" stroke-dasharray="3 2"/><line x1="1173.6" y1="378.0" x2="1280.4" y2="378.0" stroke="#9C6B12" stroke-width="1"/><line x1="1173.6" y1="372.0" x2="1173.6" y2="384.0" stroke="#9C6B12" stroke-width="1"/><line x1="1280.4" y1="372.0" x2="1280.4" y2="384.0" stroke="#9C6B12" stroke-width="1"/><text x="1227.0" y="373.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9C6B12" text-anchor="middle" font-weight="700" letter-spacing="0">transpasso</text><line x1="1252.4" y1="292.0" x2="1036.0" y2="292.0" stroke="#9C6B12" stroke-width="1.3" marker-end="url(#arr)"/><line x1="1201.6" y1="363.0" x2="1418.0" y2="363.0" stroke="#9C6B12" stroke-width="1.3" marker-end="url(#arr)"/><text x="1000.0" y="444.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="400" letter-spacing="0">As portas correm em 2 planos paralelos e se sobrepõem (transpasso):</text><text x="1000.0" y="461.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#1A1A1A" text-anchor="start" font-weight="400" letter-spacing="0">uma passa atrás da outra ao abrir e não fica fresta entre elas.</text><rect x="988.0" y="556.0" width="494.0" height="300.0" fill="#ffffff" stroke="#cdbf95" stroke-width="1.2" rx="6"/><text x="1000.0" y="578.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#9C6B12" text-anchor="start" font-weight="700" letter-spacing="0">LEGENDA — como cada sistema se comporta</text><rect x="1000.0" y="599.0" width="18.0" height="18.0" fill="#b88f51" stroke="#1A1A1A" stroke-width="1.2" rx="0"/><text x="1028.0" y="612.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" letter-spacing="0">RO-65 (Rometal) — INFERIOR, nas 2 versões</text><text x="1028.0" y="629.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8170" text-anchor="start" font-weight="400" letter-spacing="0">sustentação na base (roldana) + guia no topo;</text><text x="1028.0" y="645.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8170" text-anchor="start" font-weight="400" letter-spacing="0">60 kg/porta · 2 planos sobrepostos (transpasso).</text><rect x="1000.0" y="667.0" width="18.0" height="18.0" fill="#e7d9b6" stroke="#1A1A1A" stroke-width="1.2" rx="0"/><text x="1028.0" y="680.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" letter-spacing="0">Multi (Rometal) — SUPERIOR da Versão 1</text><text x="1028.0" y="697.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8170" text-anchor="start" font-weight="400" letter-spacing="0">suspenso pelo trilho de cima, slim, sem trilho</text><text x="1028.0" y="713.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8170" text-anchor="start" font-weight="400" letter-spacing="0">na base; ideal p/ porta pequena na faixa alta.</text><rect x="1000.0" y="735.0" width="18.0" height="18.0" fill="#ffffff" stroke="#1A1A1A" stroke-width="1.2" rx="0"/><text x="1028.0" y="748.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start" font-weight="700" letter-spacing="0">Báscula — SUPERIOR da Versão 2</text><text x="1028.0" y="765.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8170" text-anchor="start" font-weight="400" letter-spacing="0">porta única que gira no topo e abre p/ cima</text><text x="1028.0" y="781.0" font-family="DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8170" text-anchor="start" font-weight="400" letter-spacing="0">com pistão a gás (não tem transpasso).</text