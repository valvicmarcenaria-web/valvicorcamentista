<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Os dois pistões a gás lado a lado: o comum empurra a porta que abre para cima, numa báscula de aéreo; o de força inversa segura a porta que abre para baixo, controlando a descida.">
      <defs>
        <pattern id="gradeB" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M16,0 L0,0 L0,16" fill="none" stroke="#0E2038" stroke-width=".5" opacity=".07"/></pattern>
        <marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#2F7D4F"/></marker>
        <marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#B0413F"/></marker>
      </defs>
      <rect x="0" y="0" width="640" height="280" fill="#ffffff"/>
      <rect x="0" y="0" width="640" height="280" fill="url(#gradeB)"/>
      <line x1="320" y1="10" x2="320" y2="270" stroke="#d8d2c4" stroke-width="1"/>

      <!-- COMUM -->
      <g transform="translate(0,0)">
        <text x="160" y="26" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#2F7D4F" text-anchor="middle">PISTÃO COMUM — empurra</text>
        <text x="160" y="43" font-family="Inter,sans-serif" font-size="12" fill="#5f5b52" text-anchor="middle">a porta abre para cima</text>
        <rect x="160" y="96" width="130" height="110" fill="#ece0c8" stroke="#a89a78" stroke-width="1.3"/>
        <text x="225" y="156" font-family="Inter,sans-serif" font-size="11.5" fill="#5a4d31" text-anchor="middle">aéreo</text>
        <rect x="146" y="96" width="14" height="110" fill="#f6f1e6" stroke="#c4b998" stroke-width="1.1" stroke-dasharray="4 3"/>
        <g transform="rotate(105,160,96)">
          <rect x="146" y="96" width="14" height="110" fill="#ece0c8" stroke="#a89a78" stroke-width="1.4"/>
        </g>
        <circle cx="160" cy="96" r="4.5" fill="#3f444b"/>
        <line x1="250" y1="138" x2="122" y2="81" stroke="#6e737a" stroke-width="7" stroke-linecap="round"/>
        <line x1="250" y1="138" x2="122" y2="81" stroke="#3f444b" stroke-width="1" opacity=".5"/>
        <circle cx="250" cy="138" r="4.5" fill="#3f444b"/>
        <path d="M64,150 L52,96" fill="none" stroke="#2F7D4F" stroke-width="2" marker-end="url(#sv)"/>
        <text x="70" y="162" font-family="Inter,sans-serif" font-size="12" fill="#2F7D4F">a porta sobe</text>
        <text x="160" y="248" font-family="Inter,sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">báscula de aéreo</text>
        <text x="160" y="266" font-family="Inter,sans-serif" font-size="11.5" fill="#5f5b52" text-anchor="middle">o pistão vence o peso e sustenta aberta</text>
      </g>

      <!-- INVERSA -->
      <g transform="translate(320,0)">
        <text x="160" y="26" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#B0413F" text-anchor="middle">FORÇA INVERSA — segura</text>
        <text x="160" y="43" font-family="Inter,sans-serif" font-size="12" fill="#5f5b52" text-anchor="middle">a porta abre para baixo</text>
        <rect x="36" y="66" width="130" height="110" fill="#ece0c8" stroke="#a89a78" stroke-width="1.3"/>
        <text x="101" y="126" font-family="Inter,sans-serif" font-size="11.5" fill="#5a4d31" text-anchor="middle">balcão</text>
        <rect x="166" y="66" width="14" height="110" fill="#f6f1e6" stroke="#c4b998" stroke-width="1.1" stroke-dasharray="4 3"/>
        <g transform="rotate(-95,173,176)">
          <rect x="166" y="66" width="14" height="110" fill="#ece0c8" stroke="#a89a78" stroke-width="1.4"/>
        </g>
        <circle cx="173" cy="176" r="4.5" fill="#3f444b"/>
        <line x1="76" y1="96" x2="252" y2="166" stroke="#6e737a" stroke-width="7" stroke-linecap="round"/>
        <line x1="76" y1="96" x2="252" y2="166" stroke="#3f444b" stroke-width="1" opacity=".5"/>
        <circle cx="76" cy="96" r="4.5" fill="#3f444b"/>
        <path d="M268,106 L282,152" fill="none" stroke="#B0413F" stroke-width="2" marker-end="url(#sr)"/>
        <text x="266" y="98" font-family="Inter,sans-serif" font-size="12" fill="#B0413F">desce devagar</text>
        <text x="160" y="248" font-family="Inter,sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">porta de abrir para baixo</text>
        <text x="160" y="266" font-family="Inter,sans-serif" font-size="11.5" fill="#5f5b52" text-anchor="middle">o pistão trabalha contra a queda</text>
      </g>
    </svg>
