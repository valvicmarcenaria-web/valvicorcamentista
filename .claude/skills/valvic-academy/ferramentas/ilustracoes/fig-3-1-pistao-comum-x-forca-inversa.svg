<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Os dois pistões a gás lado a lado: o comum empurra a porta que abre para cima, numa báscula de aéreo; o de força inversa segura a porta que abre para baixo, girando para fora e para baixo e descendo devagar.">
      <defs>
        <pattern id="gradeB" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M16,0 L0,0 L0,16" fill="none" stroke="#0E2038" stroke-width=".5" opacity=".07"/></pattern>
        <marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#2F7D4F"/></marker>
        <marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#B0413F"/></marker>
      </defs>
      <rect x="0" y="0" width="640" height="290" fill="#ffffff"/>
      <rect x="0" y="0" width="640" height="290" fill="url(#gradeB)"/>
      <line x1="320" y1="10" x2="320" y2="280" stroke="#d8d2c4" stroke-width="1"/>

      <!-- COMUM · abre para cima -->
      <g transform="translate(0,0)">
        <text x="160" y="26" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#2F7D4F" text-anchor="middle">PISTÃO COMUM — empurra</text>
        <text x="160" y="43" font-family="Inter,sans-serif" font-size="12" fill="#5f5b52" text-anchor="middle">a porta abre para cima</text>
        <rect x="160" y="106" width="130" height="106" fill="#ece0c8" stroke="#a89a78" stroke-width="1.3"/>
        <text x="225" y="163" font-family="Inter,sans-serif" font-size="11.5" fill="#5a4d31" text-anchor="middle">aéreo</text>
        <rect x="146" y="106" width="14" height="106" fill="#f6f1e6" stroke="#c4b998" stroke-width="1.1" stroke-dasharray="4 3"/>
        <text x="140" y="206" font-family="Inter,sans-serif" font-size="10.5" fill="#8a7d5e" text-anchor="end">fechada</text>
        <g transform="rotate(105,153,106)">
          <rect x="146" y="106" width="14" height="106" fill="#ece0c8" stroke="#a89a78" stroke-width="1.4"/>
        </g>
        <circle cx="153" cy="106" r="4.5" fill="#3f444b"/>
        <text x="162" y="100" font-family="Inter,sans-serif" font-size="10.5" fill="#3f444b">pivô no topo</text>
        <line x1="248" y1="148" x2="118" y2="90" stroke="#6e737a" stroke-width="7" stroke-linecap="round"/>
        <line x1="248" y1="148" x2="118" y2="90" stroke="#3f444b" stroke-width="1" opacity=".5"/>
        <circle cx="248" cy="148" r="4.5" fill="#3f444b"/>
        <path d="M62,150 L50,100" fill="none" stroke="#2F7D4F" stroke-width="2" marker-end="url(#sv)"/>
        <text x="68" y="162" font-family="Inter,sans-serif" font-size="12" fill="#2F7D4F">a porta sobe</text>
        <text x="160" y="258" font-family="Inter,sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">báscula de aéreo</text>
        <text x="160" y="276" font-family="Inter,sans-serif" font-size="11.5" fill="#5f5b52" text-anchor="middle">o pistão vence o peso e sustenta aberta</text>
      </g>

      <!-- FORÇA INVERSA · abre para baixo -->
      <g transform="translate(320,0)">
        <text x="160" y="26" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#B0413F" text-anchor="middle">FORÇA INVERSA — segura</text>
        <text x="160" y="43" font-family="Inter,sans-serif" font-size="12" fill="#5f5b52" text-anchor="middle">a porta abre para baixo</text>
        <rect x="30" y="62" width="130" height="106" fill="#ece0c8" stroke="#a89a78" stroke-width="1.3"/>
        <text x="95" y="119" font-family="Inter,sans-serif" font-size="11.5" fill="#5a4d31" text-anchor="middle">balcão</text>
        <rect x="160" y="62" width="14" height="106" fill="#f6f1e6" stroke="#c4b998" stroke-width="1.1" stroke-dasharray="4 3"/>
        <text x="182" y="70" font-family="Inter,sans-serif" font-size="10.5" fill="#8a7d5e">fechada</text>
        <!-- pivô embaixo; a porta gira PARA FORA E PARA BAIXO -->
        <g transform="rotate(95,167,168)">
          <rect x="160" y="62" width="14" height="106" fill="#ece0c8" stroke="#a89a78" stroke-width="1.4"/>
        </g>
        <circle cx="167" cy="168" r="4.5" fill="#3f444b"/>
        <text x="150" y="188" font-family="Inter,sans-serif" font-size="10.5" fill="#3f444b" text-anchor="end">pivô embaixo</text>
        <line x1="104" y1="112" x2="223" y2="173" stroke="#6e737a" stroke-width="7" stroke-linecap="round"/>
        <line x1="104" y1="112" x2="223" y2="173" stroke="#3f444b" stroke-width="1" opacity=".5"/>
        <circle cx="104" cy="112" r="4.5" fill="#3f444b"/>
        <path d="M262,132 L276,180" fill="none" stroke="#B0413F" stroke-width="2" marker-end="url(#sr)"/>
        <text x="258" y="124" font-family="Inter,sans-serif" font-size="12" fill="#B0413F">desce devagar</text>
        <text x="160" y="258" font-family="Inter,sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">porta de abrir para baixo</text>
        <text x="160" y="276" font-family="Inter,sans-serif" font-size="11.5" fill="#5f5b52" text-anchor="middle">o pistão trabalha contra a queda</text>
      </g>
    </svg>
