<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Valvic · Painel de Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2038;--navy2:#16314F;--gold:#C2A05A;--goldsoft:#d8bd80;
      --goldbg:#F6EDD6;--ink:#1b2733;--muted:#6c7785;--line:#e3e7ec;--pale:#f5f7f9}
*{margin:0;padding:0;box-sizing:border-box}
@page{size:A3 landscape;margin:0}
body{font-family:'Inter',sans-serif;color:var(--ink);background:#8a8a8a}
.sheet{width:420mm;height:297mm;background:#fff;position:relative;overflow:hidden;
       page-break-after:always;display:flex;flex-direction:column}
.sheet:last-child{page-break-after:auto}
@media print{body{background:#fff}}
@media screen{.sheet{margin:10mm auto;box-shadow:0 3px 22px rgba(0,0,0,.35)}}

.rh{background:var(--navy);color:#fff;padding:6mm 14mm 5mm;display:flex;
    align-items:flex-end;justify-content:space-between}
.rh .kx{font-size:8.6pt;letter-spacing:.24em;text-transform:uppercase;
        color:var(--goldsoft);font-weight:700}
.rh .tt{font-family:'Cormorant Garamond',serif;font-size:30pt;font-weight:600;
        line-height:1.02;margin-top:1mm}
.rh .r{text-align:right;font-size:9pt;color:#9FB0C4;line-height:1.5}
.rh .r b{color:#fff;font-weight:700;font-size:10.5pt}
.gold-rule{height:1.6mm;background:linear-gradient(90deg,var(--gold),var(--goldsoft))}
.body{flex:1;padding:6mm 14mm 4mm;display:flex;flex-direction:column;min-height:0}
.rf{background:var(--goldbg);padding:3mm 14mm;font-size:8pt;color:#7A5B17;
    display:flex;justify-content:space-between;align-items:center;font-weight:500}

.sec{font-family:'Cormorant Garamond',serif;font-size:16pt;font-weight:600;color:var(--navy);
     display:flex;align-items:center;gap:3mm;margin:0 0 3mm}
.sec .bar{width:7mm;height:1.2mm;background:var(--gold)}
.sec .hint{font-family:'Inter',sans-serif;font-size:8.4pt;color:var(--muted);font-weight:400}

/* ---------- grade da semana ---------- */
.grade{width:100%;border-collapse:collapse;table-layout:fixed;flex:1}
.grade th.dia{background:var(--navy2);color:#fff;padding:2.6mm 1mm;text-align:center;
              border-right:.3mm solid #2a4a70}
.grade th.dia .d{font-size:8pt;letter-spacing:.16em;text-transform:uppercase;
                 color:var(--goldsoft);font-weight:700}
.grade th.dia .n{font-size:15pt;font-weight:700;line-height:1.1}
.grade th.dia.fds{background:#24405f}
.grade th.pes{background:var(--navy);color:#fff;font-size:9pt;letter-spacing:.14em;
              text-transform:uppercase;font-weight:700;padding:2.6mm 3mm;text-align:left}
.grade td{border:.3mm solid var(--line);vertical-align:top;padding:.9mm}
.grade td.fds{background:#fafbfc}
.grade td.pes{background:var(--pale);border-left:0;padding:1.6mm 3mm;vertical-align:middle}
.grade td.pes .nm{font-size:12.5pt;font-weight:700;color:var(--navy);line-height:1.1}
.grade td.pes .fn{font-size:7.6pt;color:var(--muted);margin-top:.6mm;line-height:1.25}
.grade td.pes .fr{display:inline-block;font-size:6.6pt;font-weight:700;letter-spacing:.08em;
                  background:var(--goldbg);color:#7A5B17;padding:.4mm 1.4mm;border-radius:1mm;
                  margin-top:.8mm}

.card{border-radius:1.2mm;padding:1.1mm 2mm 1.1mm 2.4mm;margin-bottom:.9mm;
      position:relative;overflow:hidden}
.card:last-child{margin-bottom:0}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1.3mm}
.card .p{font-size:7.6pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
         line-height:1.1}
.card .t{font-size:8.6pt;line-height:1.28;margin-top:.8mm;color:var(--ink)}
.card .cx{position:absolute;right:1.6mm;top:1.6mm;width:3.6mm;height:3.6mm;
          border:.35mm solid rgba(0,0,0,.28);border-radius:.6mm;background:rgba(255,255,255,.7)}
.card.conf{border:.35mm dashed rgba(0,0,0,.35);padding-bottom:4.6mm}
.card.off{background:#eef0f2;border:.35mm dashed #b9c2cc}
.card .q{position:absolute;right:1.4mm;bottom:1.2mm;font-size:6.6pt;font-weight:800;
         color:#8a6d3b;letter-spacing:.06em}
.vazio{height:100%;min-height:7mm}

.leg{display:flex;gap:1.8mm;flex-wrap:wrap;margin-top:2mm;align-items:center}
.leg .i{display:flex;align-items:center;gap:1.4mm;font-size:8.4pt;font-weight:600}
.leg .sw{width:5mm;height:5mm;border-radius:1mm}
.leg .lbl{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
          font-weight:700;margin-right:1mm}

.avisos{display:flex;gap:3mm;margin-top:2mm}
.aviso{flex:1;border:.35mm solid var(--line);border-left:1.4mm solid var(--gold);
       border-radius:1mm;padding:2mm 2.6mm;background:#fffdf7}
.aviso .h{font-size:7.6pt;letter-spacing:.14em;text-transform:uppercase;color:#7A5B17;
          font-weight:800}
.aviso .c{font-size:8.2pt;line-height:1.36;margin-top:1mm}
.aviso.risco{border-left-color:#B0413F;background:#fef8f7}
.aviso.risco .h{color:#B0413F}

/* ---------- folha 3 ---------- */
.cols{display:flex;gap:5mm;flex:1;min-height:0}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.box{border:.35mm solid var(--navy2);border-radius:1.2mm;overflow:hidden;display:flex;
     flex-direction:column}
.box>.h{background:var(--navy2);color:#fff;font-size:9pt;font-weight:700;letter-spacing:.12em;
        text-transform:uppercase;padding:2.2mm 3mm}
.box>.c{padding:3mm;flex:1}
.prio{display:flex;gap:2.4mm;align-items:flex-start;margin-bottom:2.8mm}
.prio .n{width:8mm;height:8mm;border-radius:50%;background:var(--navy);color:#fff;
         display:flex;align-items:center;justify-content:center;font-size:11pt;font-weight:800;
         flex-shrink:0}
.prio .t{font-size:10.5pt;font-weight:700;color:var(--navy);line-height:1.2}
.prio .w{font-size:8.4pt;color:var(--muted);line-height:1.35;margin-top:.8mm}
.tb{width:100%;border-collapse:collapse}
.tb th{background:#eef1f4;font-size:7.8pt;color:var(--navy2);font-weight:700;padding:2.4mm 1.6mm;
       border:.25mm solid var(--line);letter-spacing:.06em;text-align:left}
.tb td{border:.25mm solid var(--line);padding:3.1mm 1.6mm;font-size:8.8pt;line-height:1.25}
.tb td.c{text-align:center}
.pill{display:inline-block;font-size:7.2pt;font-weight:800;letter-spacing:.06em;
      padding:.5mm 1.6mm;border-radius:1mm;text-transform:uppercase}
.cx2{display:inline-block;width:4.2mm;height:4.2mm;border:.35mm solid #8b96a3;border-radius:.6mm}

/* ---------- folha 4 ---------- */
.kpis{display:flex;gap:3.4mm;margin-bottom:3mm}
.kpi{flex:1;border:.35mm solid var(--navy2);border-radius:1.2mm;text-align:center;
     padding:2.4mm 2mm;background:var(--pale)}
.kpi .k{font-size:7.6pt;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
        font-weight:700}
.kpi .v{height:11mm;border-bottom:.4mm solid #b9c2cc;margin:1.6mm 4mm 0}
.kpi .u{font-size:7.4pt;color:var(--muted);margin-top:1.4mm}
</style></head><body>
<div id="app"></div>
<script>
const P={
 simony:{n:'Simony',c:'#0E2038'}, augusto:{n:'Augusto',c:'#B0413F'},
 ana:{n:'Ana Carolina',c:'#2F5D8C'}, cristiane:{n:'Cristiane',c:'#B08442'},
 bernardo:{n:'Bernardo',c:'#6B4E8C'}, lucas:{n:'Lucas',c:'#2F7D4F'},
 maria:{n:'Maria',c:'#8C3F63'}, rejane:{n:'Rejane',c:'#A8562E'},
 luciana:{n:'Luciana Rajão',c:'#4F6B7A'}, graciane:{n:'Graciane',c:'#7A6A2E'},
 giseli:{n:'Giseli',c:'#1F7A8C'}, corte:{n:'Corte / fábrica',c:'#55627A'},
 adm:{n:'Comercial e gestão',c:'#6c7785'}
};
const hex2rgba=(h,a)=>{const n=parseInt(h.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const card=(k,t,conf)=>{const p=P[k];
  return `<div class="card${conf?' conf':''}" style="background:${hex2rgba(p.c,.10)}">
    <span style="position:absolute;left:0;top:0;bottom:0;width:1.3mm;background:${p.c}"></span>
    <div class="cx"></div><div class="p" style="color:${p.c}">${p.n}</div>
    <div class="t">${t}</div>${conf?'<div class="q">A CONFIRMAR</div>':''}</div>`};
const off=(t)=>`<div class="card off"><div class="p" style="color:#8b96a3">Sem frente definida</div>
  <div class="t" style="color:#6c7785">${t}</div></div>`;
/* célula pode ser string (1 dia) ou {h:html, span:n} */
const linha=(pes,fn,fr,cels,dias)=>{
  let out='', i=0;
  while(i<cels.length){
    const c=cels[i], span=(c&&c.span)||1, html=(c&&c.h!==undefined)?c.h:(c||'');
    out+=`<td class="${dias[i].fds?'fds':''}"${span>1?` colspan="${span}"`:''}>`+
         (html||'<div class="vazio"></div>')+'</td>';
    i+=span;
  }
  return `<tr><td class="pes"><div class="nm">${pes}</div><div class="fn">${fn}</div>
    ${fr?'<div class="fr">FREELANCER</div>':''}</td>${out}</tr>`;
};
const cabeca=(dias)=>`<tr><th class="pes">Equipe</th>${dias.map(d=>
  `<th class="dia${d.fds?' fds':''}"><div class="d">${d.d}</div><div class="n">${d.n}</div></th>`).join('')}</tr>`;
const legenda=(ks)=>`<div class="leg"><span class="lbl">Projetos</span>${ks.map(k=>
  `<span class="i"><span class="sw" style="background:${P[k].c}"></span>${P[k].n}</span>`).join('')}
  <span class="i" style="margin-left:4mm"><span class="sw" style="border:.4mm dashed #8a6d3b;background:#fff"></span>A confirmar</span>
  <span class="i"><span class="sw" style="border:.35mm solid #8b96a3;background:#fff"></span>Marque ao concluir</span></div>`;

const S1=[{d:'Segunda',n:'31'},{d:'Terça',n:'1 set'},{d:'Quarta',n:'2 set'},
          {d:'Quinta',n:'3 set'},{d:'Sexta',n:'4 set'}];
const S2=[{d:'Segunda',n:'7 set'},{d:'Terça',n:'8 set'},{d:'Quarta',n:'9 set'},
          {d:'Quinta',n:'10 set'},{d:'Sexta',n:'11 set'}];

/* ═══════════ FOLHA 1 · 31/08 a 04/09 ═══════════ */
const f1=[
 linha('Jonathan','Sócio · Comercial e gestão',0,[
   card('adm','Fechamento financeiro<br>Reuniões: <b>Otávio</b> e <b>Paulo</b> no fim do dia')
   +card('augusto','Passa a obra<br>para o Jackson')
   +card('ana','Medição da obra'),
   {h:card('adm','Comercial e administrativo — o resto da semana inteira'),span:4}],S1),

 linha('Paulo','Sócio · Programação',0,[
   card('simony','Programação'),
   card('simony','Programação'),
   card('simony','Programação')+card('maria','Lavanderia'),
   card('maria','Programação')+card('ana','Programação'),
   card('maria','Segue a programação<br>Maria e Ana Carolina')],S1),

 linha('Deivson','Coordenação de produção',0,[
   card('simony','Banheiro social<br>e despensa'),
   card('simony','Banho do casal, hóspede<br>e porta da sala'),
   card('simony','Prateleiras do quarto Duda<br>+ início da cozinha'),
   card('simony','Continuação<br>da montagem'),
   card('simony','<b>Conclusão da obra</b>')],S1),

 linha('José e Rafael','Dupla de fabricação',0,[
   card('simony','Banheiro e<br>porta da sala'),
   card('simony','Cozinha —<br>parte de baixo'),
   card('simony','Cozinha superior<br>e porta do lavabo'),
   card('simony','<b>Conclusão<br>da fabricação</b>'),
   card('maria','Fabricação<br>da lavanderia')],S1),

 linha('Jackson','Marceneiro pleno',0,[
   card('augusto','Obra'),
   card('lucas','Obra — manhã')+card('augusto','Obra — tarde'),
   card('augusto','Obra'),
   card('augusto','Obra —<br>possível conclusão'),
   card('augusto','<b>Conclusão</b>')+card('giseli','Instalação<br>dos armários')],S1),

 linha('Samuel','Marceneiro sênior',0,[
   card('cristiane','Obra'),
   card('cristiane','Obra — último dia'),
   card('rejane','Conclusão da obra',1),
   card('corte','Manutenções diversas'),
   card('maria','Fabricação da bancada<br>do escritório')],S1),

 linha('Cezar','Marceneiro · fábrica',0,[
   card('cristiane','Obra'),
   card('bernardo','Obra'),
   card('simony','Bancada do<br>quarto Duda'),
   card('luciana','Instalação<br>das portas'),
   card('luciana','Conclusão')+card('graciane','Regulagens')],S1),

 linha('Joelson','Corte',0,[
   card('corte','Corte')+card('simony','Hóspede —<br>pós-horário'),
   card('corte','Corte')+card('simony','Prateleiras quarto Duda<br>— pós-horário'),
   card('corte','Corte'),card('corte','Corte'),card('corte','Corte')],S1),

 linha('Douglas','Extra horário',1,[
   {h:card('corte','Cerca de <b>3 dias na semana</b> em extra horário — os dias ainda não estão marcados',1),span:5}],S1)
].join('');

/* ═══════════ FOLHA 2 · 07 a 11/09 ═══════════ */
const f2=[
 linha('Paulo','Sócio · Programação',0,[
   {h:card('ana','Programação da semana — a definir na sexta 4',1),span:5}],S2),
 linha('Deivson','Coordenação de produção',0,[
   {h:card('ana','Fabricação dos <b>painéis e portas</b>'),span:5}],S2),
 linha('José e Rafael','Dupla de fabricação',0,[
   {h:card('ana','Fabricação dos <b>banheiros e da lavanderia</b>'),span:5}],S2),
 linha('Cezar','Marceneiro · fábrica',0,[
   {h:card('maria','Fabricação'),span:5}],S2),
 linha('Jackson','Marceneiro pleno',0,[
   off('A definir na sexta 4'),
   {h:card('maria','<b>Montagens</b> — com o Samuel'),span:3},
   card('ana','Início das montagens')],S2),
 linha('Samuel','Marceneiro sênior',0,[
   off('A definir na sexta 4'),
   {h:card('maria','<b>Montagens</b> — com o Jackson'),span:3},
   card('ana','Início das montagens')],S2),
 linha('Joelson','Corte',0,[{h:card('corte','Corte'),span:5}],S2),
 linha('Douglas','Extra horário',1,[
   {h:card('corte','Cerca de <b>3 dias na semana</b> em extra horário — os dias ainda não estão marcados',1),span:5}],S2)
].join('');

/* ═══════════ FOLHA 2 · o que precisa estar pronto ═══════════ */
const PRONTO=[
 ['Maria — lavanderia','Fabricada na sexta 4 pelo José e Rafael','Montagem ter 8'],
 ['Maria — bancada do escritório','Fabricada na sexta 4 pelo Samuel','Montagem ter 8'],
 ['Maria — demais ambientes','Fabricação do Cezar na semana','Montagem ter a qui'],
 ['Ana Carolina — medição','Feita pelo Jonathan na segunda 31','Programação qui 3 e sex 4'],
 ['Ana Carolina — painéis e portas','Fabricação do Deivson','Montagem sex 11'],
 ['Ana Carolina — banheiros e lavanderia','Fabricação do José e Rafael','Montagem sex 11']
];
const DEC=[
 ['Definir a ordem da sexta do Jackson: Augusto e Giseli','Qua 2'],
 ['Marcar os 3 dias do Douglas nas duas semanas','Seg 31'],
 ['Agendar com a Rejane a conclusão de quarta','Seg 31'],
 ['Confirmar a medição da Ana Carolina de segunda','Seg 31'],
 ['Fechar a escala do Paulo, Jackson e Samuel para a semana do dia 7','Sex 4']
];

/* ═══════════ FOLHA 3 · PLACAR ═══════════ */
const ENTREGAS=[['Simony','Banheiro social e despensa'],['Simony','Banho do casal e hóspede'],
 ['Simony','Cozinha, lavabo e despensa'],['Simony','Quarto da Duda'],
 ['Simony','Porta e prateleira da sala'],['Augusto','Montagem completa'],
 ['Cristiane','Obra'],['Bernardo','Obra'],['Lucas','Obra'],['Rejane','Conclusão'],
 ['Luciana Rajão','Portas e alisares'],['Graciane','Regulagens'],
 ['Giseli','Instalação dos armários'],['Maria','Montagens'],['Ana Carolina','Início']];

document.getElementById('app').innerHTML = `
<section class="sheet">
  <div class="rh"><div><div class="kx">Painel de Produção · Chão de fábrica</div>
    <div class="tt">Esta semana — 31 de agosto a 4 de setembro</div></div>
    <div class="r"><b>VALVIC MARCENARIA</b><br>Coordenação: Deivson<br>
      Marque o quadradinho ao concluir</div></div>
  <div class="gold-rule"></div>
  <div class="body">
    <table class="grade"><thead>${cabeca(S1)}</thead><tbody>${f1}</tbody></table>
    ${legenda(['simony','augusto','cristiane','bernardo','lucas','rejane','luciana','graciane','giseli','maria','ana','corte'])}
    <div class="avisos">
      <div class="aviso"><div class="h">A semana é a da Simony</div>
        <div class="c">Deivson, José e Rafael e Joelson estão nela quase todos os dias, com
        <b>conclusão prevista para sexta 4</b>. Se escorregar, empurra a semana do dia 7 inteira —
        Maria e Ana Carolina dependem dessa fábrica livre.</div></div>
      <div class="aviso risco"><div class="h">Sexta o Jackson tem duas frentes</div>
        <div class="c">Conclusão do <b>Augusto</b> e armários da <b>Giseli</b> no mesmo dia. Uma
        escorrega se o Augusto passar do meio-dia. Definir a ordem até <b>quarta 2</b>.</div></div>
      <div class="aviso risco"><div class="h">O Douglas não tem dia marcado</div>
        <div class="c">São <b>3 diárias por semana</b> que ninguém planeja sem data. Fechar os
        dias na <b>segunda 31</b> — diária sem dia não vira produção, vira custo.</div></div>
      <div class="aviso risco"><div class="h">A Rejane ainda não está agendada</div>
        <div class="c">A conclusão está na quarta do Samuel, mas depende de combinar com a
        cliente. Ligar na <b>segunda 31</b> — sem confirmação, o dia dele fica vazio.</div></div>
    </div>
  </div>
  <div class="rf"><span>Atualizado em 30/08/2026 · substitua esta folha toda segunda-feira</span>
    <span>VALVIC · PRODUÇÃO &nbsp;·&nbsp; 1 / 3</span></div>
</section>

<section class="sheet">
  <div class="rh"><div><div class="kx">Painel de Produção · Chão de fábrica</div>
    <div class="tt">Próxima semana — 7 a 11 de setembro</div></div>
    <div class="r"><b>VALVIC MARCENARIA</b><br>Semana de <b>Maria</b> e <b>Ana Carolina</b><br>
      A fábrica troca de obra</div></div>
  <div class="gold-rule"></div>
  <div class="body">
    <table class="grade" style="flex:0 0 auto"><thead>${cabeca(S2)}</thead><tbody>${f2}</tbody></table>
    ${legenda(['maria','ana','corte'])}
    <div class="cols" style="margin-top:4mm">
      <div class="col" style="flex:1.25">
        <div class="box" style="flex:1"><div class="h">O que precisa estar pronto antes</div>
          <div class="c" style="padding:2mm">
            <table class="tb"><thead><tr><th>Peça</th><th style="width:74mm">De onde vem</th>
              <th style="width:40mm">Quando é exigida</th><th style="width:16mm">Pronto</th></tr></thead>
              <tbody>${PRONTO.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td>
                <td class="c"><b>${r[2]}</b></td>
                <td class="c"><span class="cx2"></span></td></tr>`).join('')}</tbody></table>
          </div>
        </div>
      </div>
      <div class="col" style="flex:.85">
        <div class="box" style="flex:1"><div class="h">Decidir até quando</div>
          <div class="c" style="padding:2mm">
            <table class="tb"><thead><tr><th>Decisão</th><th style="width:22mm">Até</th>
              <th style="width:14mm">OK</th></tr></thead><tbody>
              ${DEC.map(d=>`<tr><td>${d[0]}</td><td class="c"><b>${d[1]}</b></td>
                <td class="c"><span class="cx2"></span></td></tr>`).join('')}
            </tbody></table>
            <div class="aviso risco" style="margin-top:3mm">
              <div class="h">A medição de segunda é o gargalo da semana do dia 7</div>
              <div class="c">A <b>Ana Carolina</b> só entra em fabricação depois da medição do
              Jonathan na segunda e da programação do Paulo na quinta e sexta. Atrasou a medição,
              atrasou a montagem do dia 11 — e não há folga para recuperar.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="rf"><span>Escala fechada na sexta 4, depois da conclusão da Simony</span>
    <span>VALVIC · PRODUÇÃO &nbsp;·&nbsp; 2 / 3</span></div>
</section>

<section class="sheet">
  <div class="rh"><div><div class="kx">Medição de desempenho</div>
    <div class="tt">Placar de entregas</div></div>
    <div class="r"><b>VALVIC MARCENARIA</b><br>Preenchido pelo Deivson a cada entrega<br>
      Fechamento no último dia útil do mês</div></div>
  <div class="gold-rule"></div>
  <div class="body">
    <div class="kpis">
      <div class="kpi"><div class="k">Entregas no mês</div><div class="v"></div><div class="u">quantas foram concluídas</div></div>
      <div class="kpi"><div class="k">No prazo</div><div class="v"></div><div class="u">quantas entregaram na data prometida</div></div>
      <div class="kpi"><div class="k">% no prazo</div><div class="v"></div><div class="u">no prazo ÷ entregas</div></div>
      <div class="kpi"><div class="k">Atraso médio</div><div class="v"></div><div class="u">dias, só das atrasadas</div></div>
      <div class="kpi"><div class="k">Retrabalhos</div><div class="v"></div><div class="u">quantas voltaram à fábrica</div></div>
      <div class="kpi"><div class="k">Causa mais comum</div><div class="v"></div><div class="u">projeto · medição · produção · montagem</div></div>
    </div>
    <div class="sec"><span class="bar"></span>Entrega por entrega
      <span class="hint">uma linha por ambiente entregue · preencher no dia, não no fim do mês</span></div>
    <table class="tb" style="flex:1">
      <thead><tr><th style="width:34mm">Projeto</th><th>Ambiente</th>
        <th style="width:26mm">Prometido</th><th style="width:26mm">Entregue</th>
        <th style="width:22mm">Desvio</th><th style="width:34mm">Quem montou</th>
        <th style="width:22mm">Retrabalho</th><th style="width:60mm">Se voltou, por quê</th>
        <th style="width:34mm">Assinatura do cliente</th></tr></thead>
      <tbody>${ENTREGAS.map(e=>`<tr><td style="height:7.4mm"><b>${e[0]}</b></td><td>${e[1]}</td>
        <td></td><td></td><td class="c"></td><td></td>
        <td class="c"><span class="cx2"></span></td><td></td><td></td></tr>`).join('')}</tbody>
    </table>
    <div class="avisos" style="margin-top:3mm">
      <div class="aviso"><div class="h">O que conta como "no prazo"</div>
        <div class="c">A data prometida é a que foi combinada <b>com o cliente</b>, não a que a
        fábrica gostaria. Entregou no dia ou antes: no prazo. Um dia depois já é atraso — não
        arredonde, o número só serve se for honesto.</div></div>
      <div class="aviso"><div class="h">Retrabalho é o dado mais valioso desta folha</div>
        <div class="c">Marque sempre que uma peça voltar, mesmo que o conserto tenha sido rápido.
        Se a causa mais comum do mês for <b>medição</b>, o problema não está na produção —
        está antes dela. É isso que a folha existe para revelar.</div></div>
      <div class="aviso"><div class="h">Fechamento</div>
        <div class="c">No último dia útil, preencha os seis números do topo, fotografe a folha e
        arquive. A folha nova entra no lugar. Doze folhas ao ano contam a história inteira da
        capacidade de entrega da fábrica.</div></div>
    </div>
  </div>
  <div class="rf"><span>Sem data prometida registrada antes da entrega, não há medição — só opinião</span>
    <span>VALVIC · PRODUÇÃO &nbsp;·&nbsp; 3 / 3</span></div>
</section>`;
</script>
