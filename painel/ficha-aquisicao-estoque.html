<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ficha de aquisição — retirada de estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2038; --navy2:#16314F; --gold:#C2A05A; --goldsoft:#d8bd80;
  --goldbg:#F6EDD6; --ink:#1b2733; --muted:#6c7785; --linha:#dfe4ea;
}
@page{ size:A4 portrait; margin:0 }
*{ box-sizing:border-box }
body{ margin:0; background:#8a8f96; font-family:'Inter',system-ui,sans-serif; color:var(--ink) }
.sheet{ width:210mm; height:297mm; margin:0 auto; background:#fff; position:relative;
  padding:13mm 14mm 13mm; display:flex; flex-direction:column;
  page-break-after:always; overflow:hidden }
.sheet:last-child{ page-break-after:auto }
@media print{ body{ background:#fff } .sheet{ margin:0 } }

.topo{ display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom:2px solid var(--navy); padding-bottom:6px; margin-bottom:10px }
.marca{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700;
  color:var(--navy); letter-spacing:.5px; line-height:1 }
.marca small{ display:block; font-family:'Inter',sans-serif; font-size:8px; font-weight:600;
  letter-spacing:2.4px; text-transform:uppercase; color:var(--gold); margin-top:3px }
.doc{ text-align:right }
.doc h1{ margin:0; font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; color:var(--navy) }
.doc .meta{ font-size:8.5px; color:var(--muted); letter-spacing:.4px; margin-top:2px }

table.tb{ width:100%; border-collapse:collapse; font-size:9.5px }
table.tb th{ background:var(--navy2); color:var(--goldsoft); font-size:8px; font-weight:600;
  letter-spacing:.9px; text-transform:uppercase; padding:6px 7px; text-align:left }
table.tb td{ border-bottom:1px solid var(--linha); border-right:1px solid var(--linha);
  padding:0 7px; height:8.6mm }
table.tb td:last-child{ border-right:none }
table.tb tr:nth-child(even) td{ background:#f8fafb }
.ctr{ text-align:center }

.rodape{ margin-top:auto; border-top:1px solid var(--linha); padding-top:5px;
  display:flex; justify-content:space-between; font-size:7.5px; color:var(--muted);
  letter-spacing:.5px; text-transform:uppercase }
</style>
</head>
<body>

<div class="sheet">

    <div class="doc">
